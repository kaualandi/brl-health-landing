name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brl
          POSTGRES_PASSWORD: brl
          POSTGRES_DB: brlhealth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brl -d brlhealth"
          --health-interval 2s
          --health-retries 20

    env:
      DATABASE_URL: postgres://brl:brl@localhost:5432/brlhealth
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      AUTH_RATE_LIMIT: "1000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Migrate & seed
        working-directory: apps/api
        run: bun run db:migrate && bun run db:seed

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
