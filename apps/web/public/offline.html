<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d0d1a" />
    <title>Sem conexão — BRL Health</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem 1.25rem;
        text-align: center;
        background:
          radial-gradient(
            55% 50% at 50% 0%,
            rgba(150, 86, 161, 0.18) 0%,
            rgba(13, 13, 26, 0) 70%
          ),
          #0d0d1a;
        color: #f5f2ff;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }
      .brand {
        font-size: 0.8rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-weight: 700;
        color: #9656a1;
      }
      .emoji {
        font-size: 3.5rem;
        line-height: 1;
      }
      h1 {
        margin: 0;
        font-size: 1.6rem;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        max-width: 26rem;
        color: #9988aa;
        line-height: 1.5;
      }
      button {
        margin-top: 0.5rem;
        cursor: pointer;
        border: 0;
        border-radius: 0.75rem;
        padding: 0.85rem 1.5rem;
        font-size: 1rem;
        font-weight: 600;
        color: #ffffff;
        background: #9656a1;
        transition: background 0.15s ease;
      }
      button:hover {
        background: #84478f;
      }
      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <span class="brand">BRL Health</span>
    <span class="emoji" aria-hidden="true">📡</span>
    <h1>Você está sem conexão.</h1>
    <p>
      Não conseguimos carregar essa página agora. Assim que a internet voltar, é
      só tentar de novo — seus dados continuam salvos no aparelho.
    </p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </body>
</html>
